name: ci

# Keeps the simulation harness and the committed evidence formats valid
# (T1 item 10, "Repo hygiene"; issue #18). harness-tests and evidence-formats
# need NO PDK and NO simulator and stay that way. The separate sim-smoke job
# (issue #47) installs the pinned IHP models + ngspice and runs the smoke and
# negative-control modes; it commits/uploads no evidence. signoff.yml (the
# manifest re-grade) is a separate workflow and is not touched by this one.
#
# Runs on every push and every pull request. No job cancels another run: a
# slow correct job beats a clever fast one, and a distinct commit's verdict
# must exist.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness-tests:
    name: harness + Ka-band unit tests (no PDK, no simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (pinned ranges in requirements-test.txt)
        run: pip install -r requirements-test.txt
      - name: Byte-compile every Python file
        run: python -m compileall -q sim .github/scripts
      - name: Harness unit tests (corners, evidence, report, testbench manifests)
        run: python -m pytest sim/harness/tests -q
      - name: Ka-band postprocessor unit tests
        run: python -m pytest sim/hbt-kaband-characterization/tests -q
      - name: lna-sparam-nf noise-figure normalization tests
        run: python -m pytest sim/lna-sparam-nf/tests -q
      - name: mixer-topology-feasibility extraction / selection / gate tests
        run: python -m pytest sim/mixer-topology-feasibility/tests -q
      - name: lna-match-tradeoff family / extraction / bound / shortlist / gate / collection tests (closed-form fake klt)
        run: python -m pytest sim/lna-match-tradeoff/tests -q
      - name: mixer-nf-method analytic tests (PSD/Parseval, SSB/image accounting, status gates; methodology only, no simulator)
        run: python -m pytest sim/mixer-nf-method/tests/test_nfmethod.py -v

  evidence-formats:
    name: evidence formats + append-only history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the append-only check compares against the MERGE
          # BASE with the base branch, which a shallow clone cannot provide.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install pytest
      - name: Checker self-test (negative controls on broken fixtures and temporary git histories)
        run: python -m pytest .github/scripts/tests -q
      # The spec-row coverage check (spec/row-coverage.json vs the table in
      # spec/target-spec.md; issue #50) runs inside the next step as the
      # "row-coverage:" line, and its negative controls are in the self-test
      # above (test_check_row_coverage.py). No PDK, no simulator.
      - name: Validate committed evidence and enforce append-only history
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Comparison base for the append-only check (the script always
          # diffs against the merge base of this ref and HEAD):
          #   pull_request      origin/<base branch>; a base is mandatory
          #   push to main      the pre-push commit (event.before) when the
          #                     push has one; an all-zero/unknown sha makes
          #                     the script skip the history half loudly and
          #                     still run the format half
          #   push to a branch  origin/main; a base is mandatory
          require=--require-base
          if [ "$EVENT" = pull_request ]; then
            base="origin/${BASE_REF}"
          elif [ "$REF" = refs/heads/main ]; then
            base="$BEFORE"
            require=
          else
            base=origin/main
          fi
          echo "event=$EVENT base=$base"
          python .github/scripts/check_evidence_formats.py --base "$base" $require

  sim-smoke:
    name: simulator smoke + negative controls (pinned IHP models, ngspice 46)
    # Fixed image (not -latest) so the apt dependency set resolves the same way
    # on every run; the image name is part of the ngspice cache key.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Pins live in sim/pdk-artifact.json; keep these two in step with it
      # (sim/harness/tests/test_ci_pins.py fails if they drift apart).
      IHP_PDK_COMMIT: 5cccb161f7492697cfa52eb14dc03beb00bdca9e
      NGSPICE_VERSION: '46'
      NGSPICE_SHA256: a0d1699af1940b06649276dcd6ff5a566c8c0cad01b2f7b5e99dedbb4d64c19b
      # The ngspice build recipe. Both strings feed the cache key below, so a
      # change to the dependency set or the configure flags forces a rebuild.
      # libreadline-dev: configure refuses to run without GNU readline headers.
      NGSPICE_BUILD_DEPS: build-essential bison flex libreadline-dev
      NGSPICE_CONFIGURE_FLAGS: --disable-debug --without-x
      SG13G2_REQUIRE_NGSPICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore ngspice build
        id: ngcache
        uses: actions/cache@v4
        with:
          path: ~/ngspice-prefix
          key: ngspice-${{ env.NGSPICE_VERSION }}-${{ env.NGSPICE_SHA256 }}-ubuntu-24.04-[${{ env.NGSPICE_BUILD_DEPS }}]-[${{ env.NGSPICE_CONFIGURE_FLAGS }}]-v2

      - name: Build pinned ngspice from the checksummed release tarball
        if: steps.ngcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $NGSPICE_BUILD_DEPS
          mkdir -p "$RUNNER_TEMP/ng" && cd "$RUNNER_TEMP/ng"
          curl -fsSL --retry 3 -o ngspice.tar.gz \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz"
          echo "${NGSPICE_SHA256}  ngspice.tar.gz" | sha256sum -c -
          tar xzf ngspice.tar.gz
          mkdir build && cd build
          "../ngspice-${NGSPICE_VERSION}/configure" --prefix="$HOME/ngspice-prefix" $NGSPICE_CONFIGURE_FLAGS
          make -j2
          make install
      - name: Put ngspice on PATH
        run: echo "$HOME/ngspice-prefix/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned IHP-Open-PDK model files (immutable commit id)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/ihp"
          cd "$RUNNER_TEMP/ihp"
          git remote add origin https://github.com/IHP-GmbH/IHP-Open-PDK.git
          git sparse-checkout init --cone
          git sparse-checkout set ihp-sg13g2/libs.tech/ngspice/models
          git fetch -q --depth 1 --filter=blob:none origin "$IHP_PDK_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$IHP_PDK_COMMIT"
          echo "SG13G2_PDK_PATH=$RUNNER_TEMP/ihp/ihp-sg13g2" >> "$GITHUB_ENV"

      - name: Verify IHP models + ngspice against sim/pdk-artifact.json (before any simulation)
        working-directory: sim
        run: python3 -m harness.cli verify-pdk --require-ngspice

      - name: Integrity-gate unit tests (tamper / missing / unknown-marker fixtures)
        run: |
          pip install pytest
          python -m pytest sim/harness/tests/test_pdkartifact.py sim/harness/tests/test_ci_pins.py -q

      - name: Negative control - a tampered model file must stop characterize.sh before any simulator runs
        run: |
          set -uo pipefail
          cp -r "$SG13G2_PDK_PATH" "$RUNNER_TEMP/tampered"
          echo "* tamper" >> "$RUNNER_TEMP/tampered/libs.tech/ngspice/models/sg13g2_hbt_mod.lib"
          # GitHub runs this step under bash -e, which `set -uo pipefail` does
          # not undo: capture the expected non-zero exit instead of letting it
          # end the step, then require exactly 2 (refused before simulating).
          status=0
          SG13G2_PDK_PATH="$RUNNER_TEMP/tampered" sim/characterize.sh smoke || status=$?
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 (refused before simulating) for a tampered model, got $status" >&2
            exit 1
          fi

      - name: Smoke (hbt_typ only, writes no evidence)
        run: sim/characterize.sh smoke

      - name: Selftest (sabotaged-corner and bad-deck negative controls)
        run: sim/characterize.sh selftest

      # mixer-topology-feasibility is NOT enumerated by sim/characterize.sh
      # (issue #63); its local, non-recording controls run here as explicit
      # steps, after the model-integrity verification above. The full `collect`
      # campaign stays off hosted CI. Pure stdlib + the in-repo harness, so no
      # extra pip install is needed. A nonzero exit fails the step; green means
      # only that the decks netlist, simulate on the pinned models and extract
      # correctly, not that any topology meets the spec or a drive was chosen.
      - name: Mixer-topology smoke (real candidate decks, pinned models, analytic extraction; records nothing)
        run: python3 sim/mixer-topology-feasibility/run.py smoke

      - name: Mixer-topology selftest (analytic IIP3, process sensitivity, sabotage, mismatch seeds, invalid measurements; records nothing)
        run: python3 sim/mixer-topology-feasibility/run.py selftest

      # lna-match-tradeoff (issue #74): local single-point controls only (pad
      # closed form at 27 / -40 C, baseline reproduction against the
      # lna-sparam-nf record, bound model check, alterparam cross-check, op
      # invariance, process sensitivity). Records nothing; the PVT campaign
      # stays on the batch fleet.
      - name: LNA match-tradeoff smoke (pinned models; records nothing)
        run: python3 sim/lna-match-tradeoff/run.py smoke

      # passive-p1 (issue #83): the synthetic numerical controls of the passive
      # analysis chain (known-answer, wrong-value, malformed-input, synthetic
      # pipeline). No openEMS, no PDK passive model; one local ngspice -b per
      # check. NO --write-record, so nothing is published. A missing dependency
      # (SciPy included), a crash or a failed control exits nonzero and fails the
      # job. A pass does NOT establish EM convergence and does NOT qualify p1.
      - name: Passive-p1 synthetic numerical controls (known-answer, wrong-value, malformed, pipeline; records nothing)
        run: |
          pip install -r requirements-sim.txt
          python3 sim/passive-p1/scripts/controls.py all

      - name: No evidence record or tracked file was created or changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain >&2
            echo "sim-smoke must leave the tree untouched (no committed evidence)" >&2
            exit 1
          fi
